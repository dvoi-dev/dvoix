name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Platform-specific problems (path separators, the title bar on Windows,
  # percent-decoding, file watching backends) otherwise only show up after
  # tagging a release. The weekly run catches breakage from dependency and
  # runner image updates even when no pull request touches them.
  schedule:
    - cron: "0 4 * * 1"
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      # One broken platform must not hide the result of the others.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Only Linux needs the webkit/GTK libraries; Windows and macOS ship
      # their webview with the runner image.
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev libxdo-dev libssl-dev

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run test

      # Toolchain comes from rust-toolchain.toml (latest stable).
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # Formatting and lints are platform-independent; running them once
      # keeps the matrix fast. The tests run on every platform.
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
